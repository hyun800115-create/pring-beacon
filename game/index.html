<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dfe9f5">
<meta name="mobile-web-app-capable" content="yes">
<title>봄날의 행진</title>
<link rel="icon" type="image/png" href="assets/characters/portrait_player.png">
<link rel="stylesheet" href="src/ui/hud.css">
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<div id="sm-loading"><div class="flake">❄</div><div>봄날의 행진</div><small id="sm-loading-txt">불러오는 중…</small></div>
<div id="sm-rotate"><div class="phone">📱</div><div>휴대폰을 가로로 돌려 주세요</div></div>
<div id="sm-error"></div>
<script>
  (function () {
    var box = document.getElementById('sm-error'), shown = false;
    function show(msg, detail) {
      if (shown) return; shown = true;
      box.innerHTML = '';
      var p = document.createElement('div'); p.textContent = msg; box.appendChild(p);
      if (detail) { var d = document.createElement('small'); d.textContent = detail; box.appendChild(d); }
      var b = document.createElement('button'); b.textContent = '새로고침'; b.onclick = function () { location.reload(); }; box.appendChild(b);
      box.style.display = 'block';
    }
    window.__smShowError = show;
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) { show('게임 파일을 불러오지 못했어요.', t.src || t.href); return; }
      show('문제가 생겼어요. 새로고침해 주세요.', e && e.message ? String(e.message) : '');
    }, true);
  })();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
