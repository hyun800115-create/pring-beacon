<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3D 모델 보기</title>
<style>html,body{margin:0;height:100%;background:#dfe8f2;overflow:hidden;font-family:sans-serif}#info{position:fixed;left:8px;top:8px;background:#fff;padding:6px 10px;border-radius:8px;font-size:13px}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="info">불러오는 중…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const keys = (q.get('k') || 'npc_young_man').split(',');
const clipsWanted = (q.get('c') || 'idle,walk,carry_walk,happy,talk,dance').split(',');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe8f2);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
cam.position.set(6, 5, 6);
const ctl = new OrbitControls(cam, renderer.domElement); ctl.target.set(0, 0.5, 0);
scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x8a93a8, 1.6));
const sun = new THREE.DirectionalLight(0xfff2de, 2.6); sun.position.set(-4, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -6; sun.shadow.camera.right = 6; sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0xf2f6fb, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const mixers = [];
const loader = new GLTFLoader();
let col = 0;
for (const k of keys) {
  const [g, meta] = await Promise.all([loader.loadAsync(`assets3d/chars/${k}.glb`), fetch(`assets3d/chars/${k}.json`).then((r) => r.json())]);
  const tracks = g.animations.flatMap((a) => a.tracks);
  for (const t of tracks) if (t.name.endsWith('.scale') && t.values.every((v) => v === 0 || v === 1)) t.setInterpolation(THREE.InterpolateDiscrete);
  const clip = new THREE.AnimationClip('all', -1, tracks);
  const fps = 24;
  clipsWanted.forEach((cn, row) => {
    const c = meta.clips[cn];
    if (!c) return;
    const obj = (row === 0 && col === 0) ? g.scene : (await_clone(g.scene));
    obj.position.set(col * 1.4 - (keys.length - 1) * 0.7, 0, row * 1.3 - clipsWanted.length * 0.6);
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(obj);
    const sub = THREE.AnimationUtils.subclip(clip, cn, c.start, c.end, fps);
    const m = new THREE.AnimationMixer(obj);
    const act = m.clipAction(sub); act.play();
    m.timeScale = c.fps / fps;
    mixers.push(m);
  });
  col++;
}
function await_clone(s) { return s.clone(true); }
const props = (q.get('p') || '').split(',').filter(Boolean);
let px = -props.length * 1.6;
for (const k of props) {
  const g = await loader.loadAsync(`assets3d/props/${k}.glb`);
  const box = new THREE.Box3().setFromObject(g.scene); const w = box.max.x - box.min.x;
  px += w / 2 + 0.4; g.scene.position.set(px, 0, -3.5); px += w / 2 + 0.4;
  g.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(g.scene);
}
if (props.length) { cam.position.set(0, 9, 12); ctl.target.set(0, 1, -2); }
document.getElementById('info').textContent = keys.join(', ') + ' · ' + clipsWanted.join(', ');
window.__ready = true;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); for (const m of mixers) m.update(dt); ctl.update(); renderer.render(scene, cam); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
</script>
</body>
</html>
